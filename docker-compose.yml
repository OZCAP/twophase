# Twophase on your tailnet. Tailscale runs alongside it and serves:
#   https://<TS_HOSTNAME>.<tailnet>.ts.net   web app, admin API, hosted MCP
#   <TS_HOSTNAME>:6432                        Postgres clients
#   <TS_HOSTNAME>:3307                        MySQL / MariaDB clients
#
#   cp .env.example .env    # set TS_AUTHKEY and ADMIN_TAILSCALE_ALLOW
#   docker compose up -d
#
# Both containers restart with Docker (restart: unless-stopped), so they come back after a reboot.
# Their state lives in named volumes: twophase-data (the database) and tailscale-state (the
# node's identity). The auth key is only used for the first login; after that the stored state
# reconnects, even once the key has expired. No ports are published on the host.
# Without Tailscale, use docker-compose.local.yml instead.

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-twophase}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun or extra capabilities needed.
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro

  twophase:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: twophase:latest
    restart: unless-stopped
    # Shares the Tailscale container's network, so `tailscale serve` reaches it on 127.0.0.1.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      HOST: 127.0.0.1
      # Only these tailnet devices may use the app and approve (tags, logins or machine names).
      ADMIN_AUTH: tailscale
      ADMIN_TAILSCALE_ALLOW: ${ADMIN_TAILSCALE_ALLOW:?set ADMIN_TAILSCALE_ALLOW in .env, e.g. tag:admin-client}
      TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      APPROVAL_TIMEOUT_SECONDS: ${APPROVAL_TIMEOUT_SECONDS:-300}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    volumes:
      - twophase-data:/data
      - tailscale-socket:/var/run/tailscale

volumes:
  twophase-data:
  tailscale-state:
  tailscale-socket:
