# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Twophase
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple team ID
targets:
  Twophase:
    type: application
    platform: iOS
    sources: [Twophase]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.twophase # must match APNS_BUNDLE_ID on the server
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Twophase/Twophase.entitlements
      properties:
        aps-environment: development
    info:
      path: Twophase/Info.plist
      properties:
        CFBundleDisplayName: Twophase
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
